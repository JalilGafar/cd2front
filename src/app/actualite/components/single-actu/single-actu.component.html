<article>
    <div class="card" *ngIf="actualite$ | async as actualite">
        <h1>{{actualite[0].title}} </h1>
        <!-- <a routerLink="/actualites">Back</a> -->
        <p> Mise en ligne {{actualite[0].createdDate | date }} </p>
        <img class="center" [src]="'../../../../assets/images/article/'+actualite[0].illustration+'.webp'" [alt]="actualite[0].title" >
        <div [innerHTML]="actualite[0].content"></div>
        <button button type="button" class="btn btn-primary" (click)="trouverForm()" >Trouver ma future école</button>
    </div>
</article>
