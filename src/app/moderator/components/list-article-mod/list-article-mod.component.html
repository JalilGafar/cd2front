<div class="articles-container">
    <div class="articles-header">
        <h2>Articles</h2>
        <button pButton type="button" label="Nouvel article" icon="pi pi-plus"
            (click)="onNewArticle()">
        </button>
    </div>

    <ng-container *ngIf="loading$ | async; else tableContent">
        <p>Chargement...</p>
    </ng-container>

    <ng-template #tableContent>
        <p-table
            [value]="(articles$ | async) || []"
            selectionMode="single"
            (onRowSelect)="onRowSelect($event)"
            [paginator]="true" [rows]="15"
            [tableStyle]="{'min-width': '40rem'}">

            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="title">Titre <p-sortIcon field="title" /></th>
                    <th pSortableColumn="auteur">Auteur <p-sortIcon field="auteur" /></th>
                    <th pSortableColumn="createdDate">Date <p-sortIcon field="createdDate" /></th>
                    <th pSortableColumn="visible">Visible <p-sortIcon field="visible" /></th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-article>
                <tr [pSelectableRow]="article">
                    <td>{{ article.title }}</td>
                    <td>{{ article.auteur }}</td>
                    <td>{{ article.createdDate | date:'dd/MM/yyyy' }}</td>
                    <td>
                        <span [ngClass]="article.visible ? 'badge-visible' : 'badge-hidden'">
                            {{ article.visible ? 'Publié' : 'Brouillon' }}
                        </span>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr><td colspan="4">Aucun article.</td></tr>
            </ng-template>
        </p-table>
    </ng-template>
</div>
